[default]

; Echo Test — dial 9999 to hear your own voice back
exten => 9999,1,Answer()
exten => 9999,n,Echo()
exten => 9999,n,Hangup()

; MicroSIP (1001) calling Real Phone (1002)
exten => 1001,1,Answer()
exten => 1001,n,Dial(SIP/1001,20)   ; Ring for 20 seconds
exten => 1001,n,Goto(1001-vm,1)     ; If no answer, go to voicemail
exten => 1001,n,Hangup()

; Call to 1002
exten => 1002,1,Answer()
exten => 1002,n,Dial(SIP/1002,20)
exten => 1002,n,Goto(1002-vm,1)     ; If no answer, go to voicemail
exten => 1002,n,Hangup()

