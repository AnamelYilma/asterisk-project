; MicroSIP (1001) calling Real Phone (1002)
exten => 1001,1,Answer()
exten => 1001,n,Dial(SIP/1001,20)   ; Ring for 20 seconds
exten => 1001,n,Goto(1001-vm,1)     ; If no answer, go to voicemail
exten => 1001,n,Hangup()

