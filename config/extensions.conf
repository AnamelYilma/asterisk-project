[default]

;================================================
; ECHO TEST — dial 999 or 9999
; You hear your own voice back
; Press # to hang up
;================================================
exten => 999,1,Answer()
exten => 999,n,Wait(1)
exten => 999,n,Playback(demo-echotest)
exten => 999,n,Echo()
exten => 999,n,Playback(demo-echodone)
exten => 999,n,Hangup()

exten => 9999,1,Answer()
exten => 9999,n,Wait(1)
exten => 9999,n,Playback(demo-echotest)
exten => 9999,n,Echo()
exten => 9999,n,Playback(demo-echodone)
exten => 9999,n,Hangup()

; MicroSIP (1001) calling Real Phone (1002)
exten => 1001,1,Answer()
exten => 1001,n,Dial(PJSIP/1002,20)   ; Ring 1002 for 20 seconds
exten => 1001,n,VoiceMail(1002@default,u)
exten => 1001,n,Hangup()

; Call to 1002
exten => 1002,1,Answer()
exten => 1002,n,Dial(PJSIP/1001,20)
exten => 1002,n,VoiceMail(1001@default,u)
exten => 1002,n,Hangup()
