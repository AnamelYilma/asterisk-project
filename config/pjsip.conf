[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=172.17.0.2/32
external_media_address=192.168.1.7
external_signaling_address=192.168.1.7:5070
allow_reload=yes

;========== USER 1001 ==========
[1001]
type=auth
auth_type=userpass
password=pass1001
username=1001

[1001]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=30

[1001]
type=endpoint
context=from-internal
transport=transport-udp
disallow=all
allow=ulaw
auth=1001
aors=1001
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
identify_by=username

